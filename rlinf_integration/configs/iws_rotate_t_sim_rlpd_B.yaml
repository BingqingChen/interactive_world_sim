# Run B of the sim-first recipe plan (2026-09-12): Run A + RLPD's offline demo
# buffer (symmetric 50/50 batches: 128 online + 128 demo per update).
# Demos: 200 real rotate-T episodes (global episodes 0-199 of
# datasets/scaling_v3/real/{A..H}.zarr), image-only obs, the same normalized
# delta actions, pixel-angle proxy reward. Online reward here is the simulator's
# ground truth, so the two buffers' rewards differ slightly (proxy validated at
# ~0.8 deg error on real frames, no flatness gate).
# Everything else is identical to iws_rotate_t_sim_rlpd_A.yaml.
defaults:
  - env/iws_rotate_t_sim_visuo@env.train
  - env/iws_rotate_t_sim_visuo@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "iws_rotate_t_sim_rlpd_B"
    logger_backends: ["tensorboard"]

  max_epochs: 3000
  max_steps: -1

  only_eval: False
  val_check_interval: 300
  save_interval: 300

algorithm:
  update_epoch: 4
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 2

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  critic_actor_ratio: 4

  replay_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 4
    auto_save: False

  demo_buffer:
    enable_cache: True
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 1
    load_path: "/home/jacobhb/projects/worth_doing/interactive_world_sim/.claude/worktrees/rlpd-imagined-rotate-t/outputs/rlpd_offline_demo_r200_seed1_none_delta"
    auto_save: False

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 8
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 20
    env_seed_base: 500000
    max_steps_per_rollout_epoch: 100
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 1
    action_dim: 32
    num_action_chunks: 1
    num_q_heads: 10
    precision: ${actor.model.precision}

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 42
  enable_offload: False
  enable_drq: True

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 1
    action_dim: 32
    num_action_chunks: 1
    num_q_heads: 10

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
