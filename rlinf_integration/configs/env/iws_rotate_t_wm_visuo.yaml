env_type: iws_rotate_t_wm

total_num_envs: null
auto_reset: True
ignore_terminations: True
use_rel_reward: False
seed: 0
group_size: 1
max_episode_steps: 60  # chunks; must match wm_max_chunks
max_steps_per_rollout_epoch: 2

video_cfg:
  save_video: False
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

# IWSRotateTWorldEnv._build_dataset keys.
n_action_steps: 8
# Episode cap in chunks. Demo episodes take a median of 36 chunks (p90 54), so the
# earlier plan's 40 would cut off many feasible successes; 60 covers p90.
# Degenerate long rollouts are ended by morph_terminate_patience instead.
wm_max_chunks: 60
wm_ckpt: "/home/jacobhb/projects/worth_doing/interactive_world_sim/ckpts/push_t/epoch=3-step=90000.ckpt"
wm_config: pusht_mujoco
dec_infer_steps: 2
x_range: [-0.06, 0.06]
y_range: [-0.06, 0.06]
feasible_mask: "/home/jacobhb/projects/worth_doing/interactive_world_sim/datasets/feasible_mask_v3.json"
env_seed_base: 700000   # real-reset seeds for WM episodes, disjoint from sim train (42) / eval (500000, 9000)
state_history: none
action_mode: delta
max_step: 0.04
