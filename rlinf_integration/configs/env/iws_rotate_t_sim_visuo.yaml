env_type: iws_rotate_t_sim

total_num_envs: null
auto_reset: True
ignore_terminations: True
use_rel_reward: False
seed: 0
group_size: 1
max_episode_steps: 100  # in chunks (n_action_steps=8 raw steps each)
max_steps_per_rollout_epoch: 2

video_cfg:
  save_video: False
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

# IWSRotateTSimEnv._build_dataset keys.
n_action_steps: 8
max_steps: 800  # raw env steps = 100 chunks
n_obs_steps: 2
x_range: [-0.06, 0.06]
y_range: [-0.06, 0.06]
feasible_mask: "/home/jacobhb/projects/worth_doing/interactive_world_sim/datasets/feasible_mask_v3.json"
env_seed_base: 42
state_history: none   # image-only visuomotor policy
action_mode: delta    # normalized per-step EE-xy deltas, integrated server-side
max_step: 0.04        # meters per raw step at |a|=1 (demo p99.9 per-step |delta| ~0.04-0.05)
