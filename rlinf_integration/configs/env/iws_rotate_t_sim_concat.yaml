env_type: iws_rotate_t_sim

total_num_envs: null
auto_reset: True
ignore_terminations: True
use_rel_reward: False
seed: 0
group_size: 1
max_episode_steps: 100  # in CHUNKS (n_action_steps=8 raw steps each) -- see max_steps below
max_steps_per_rollout_epoch: 2

video_cfg:
  save_video: False
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

# IWSRotateTSimEnv._build_dataset's own cfg keys (read directly off this top-level
# block, not nested under init_params -- that's ManiSkill's own convention, not a
# BaseWorldEnv requirement).
n_action_steps: 8
max_steps: 800  # RAW env steps (AlohaChunkEnv's own units) = 100 chunks
n_obs_steps: 2
x_range: [-0.06, 0.06]
y_range: [-0.06, 0.06]
feasible_mask: "/home/jacobhb/projects/worth_doing/interactive_world_sim/datasets/feasible_mask_v3.json"
env_seed_base: 42
state_history: concat_state  # states = concat(prev,curr) EE-xy, state_dim doubles to 8
