# RLPD-recipe validation, condition 1 (WM-only analog): SAC in the REAL simulator
# (ground-truth angle+flatness reward, IWSRotateTSimEnv) with an EMPTY demo_buffer --
# i.e. vanilla online SAC, RLPD's "R=0" analog. Purpose: validate the RLPD recipe
# itself (env -> CNN policy -> SAC update -> checkpoint -> eval) end-to-end against
# ground truth while the WM's own proxy reward estimator is finalized in parallel
# (see the plan doc's "validate the RL recipe in simulator" section). One seed is
# sufficient to confirm the recipe works -- this is not a statistics run.
#
# obs: "single" state_history -- main_images = latest frame only, states = latest
# EE-xy only (state_dim=4), RLinf's native CNNPolicy convention exactly. Run
# side-by-side (2 GPUs) against iws_rotate_t_sim_concat_sac.yaml (state_dim=8,
# prev+curr EE-xy) rather than deciding which state representation matters a priori.
#
# Structural skeleton: frankasim_sac_cnn_async.yaml (single-node CNN+SAC on a
# simulator -- the closest existing precedent; the real-hardware RLPD template
# (realworld_dexpnp_rlpd_cnn_async.yaml) was a poor structural match: 2-node async,
# separate reward-model worker, real-robot-only env fields).
defaults:
  - env/iws_rotate_t_sim_single@env.train
  - env/iws_rotate_t_sim_single@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "iws_rotate_t_sim_single_sac_r0"
    logger_backends: ["tensorboard"]

  max_epochs: 3000
  max_steps: -1

  only_eval: False
  val_check_interval: 100
  save_interval: 200

algorithm:
  update_epoch: 4
  group_size: 1
  agg_q: min
  actor_agg_q: min          # SAC (not RLPD -- no demo_buffer -> use SAC's own agg, not RLPD's mean)
  backup_entropy: True
  critic_subsample_size: 2  # num_q_heads=10 below; RLPD-style REDQ subsampling used regardless of demo_buffer presence
  enable_drq: False

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: standard
  gamma: 0.96   # matches AlohaChunkEnv's reward scale precedent (ppo_residual_rotate_t.py)
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.2
    target_entropy: -4   # -action_dim
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  critic_actor_ratio: 4

  # Replay buffer (online). No algorithm.demo_buffer block at all -- this is the
  # "condition 1" (WM-only analog) config: verify RLinf's SAC path degrades cleanly
  # to vanilla online SAC (100% online sampling) with no offline block present,
  # per the plan's Part 3 note.
  replay_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 4
    auto_save: False

  num_updates_per_step: 32
  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 8   # real_sim_chunk_server steps envs in a plain Python loop
                          # (no internal parallelism) -- kept modest for a validation
                          # run, not a throughput-tuned production count.
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 4
    max_steps_per_rollout_epoch: 20   # chunk_step calls per eval env, enough to let most episodes finish (max_episode_steps=100)
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 4
    action_dim: 4
    num_action_chunks: 1  # must match actor.model.num_action_chunks -- see that field's comment
    num_q_heads: 10
    precision: ${actor.model.precision}

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 128
  global_batch_size: 128
  seed: 42
  enable_offload: False

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 4
    action_dim: 4
    # num_action_chunks=1: CNNPolicy's action head outputs exactly action_dim
    # values per call regardless of this setting (confirmed by a real crash when
    # it was tried at 8: "shape '[-1, 8, 4]' is invalid for input of size 16") --
    # this policy family is architecturally single-action-per-call, like every
    # other SAC/RLPD CNN precedent in this repo. The env still preserves
    # AlohaChunkEnv's validated 8-step reward granularity via action-repeat
    # inside real_sim_chunk_server.py (see IWSRotateTSimEnv.chunk_step's
    # docstring) -- RLinf itself only ever sees width-1 action chunks here.
    num_action_chunks: 1
    num_q_heads: 10

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False   # env's own chunk_step reward (ground-truth eval_success gate) is used directly

critic:
  use_critic_model: False
