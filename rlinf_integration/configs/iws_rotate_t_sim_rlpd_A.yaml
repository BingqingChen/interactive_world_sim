# Run A of the sim-first recipe plan (2026-09-12): the likely-bug fixes on top of
# the §12 recipe-validation run (46%/44% at N=50), still pure online SAC.
#   - image-only visuomotor obs (constant zero state, state_dim=1)
#   - normalized per-step delta actions (32-D = 8 x 4), integrated server-side
#     with max_step=0.04 m; the old absolute actions let exploration span [-1,1] m
#   - RLinf RLPD-style entropy settings: initial_alpha 0.01, target_entropy
#     -action_dim/2, backup_entropy False, actor_agg_q mean
#   - gamma 0.99 (demo success ~36 chunks away; 0.96^36 ~ 0.23)
#   - DrQ random-shift augmentation (actor.enable_drq -- the worker reads it
#     from actor, not algorithm)
#   - in-training eval: 20 envs, independent seed, 100-chunk budget (the old 20
#     chunks cut most episodes before they could finish); eval and checkpoint
#     every 300 epochs so every eval point has a checkpoint.
# Run B = this + demo_buffer. Run C (not yet) = B + higher update-to-data ratio.
defaults:
  - env/iws_rotate_t_sim_visuo@env.train
  - env/iws_rotate_t_sim_visuo@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,actor,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "iws_rotate_t_sim_rlpd_A"
    logger_backends: ["tensorboard"]

  max_epochs: 3000
  max_steps: -1

  only_eval: False
  val_check_interval: 300
  save_interval: 300

algorithm:
  update_epoch: 4
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 2

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -16   # -action_dim/2, RLinf's RLPD convention
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  critic_actor_ratio: 4

  replay_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 4
    auto_save: False

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 8
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 20
    env_seed_base: 500000   # independent of train (42) and the canonical eval (9000)
    max_steps_per_rollout_epoch: 100   # full episode budget (max_steps 800 raw = 100 chunks)
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 1
    action_dim: 32
    num_action_chunks: 1
    num_q_heads: 10
    precision: ${actor.model.precision}

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 42
  enable_offload: False
  enable_drq: True

  model:
    model_path: "/home/jacobhb/projects/intern_project/RLinf/RLinf-ResNet10-pretrained"
    state_dim: 1          # constant zero state: image-only policy
    action_dim: 32        # 8 waypoints x 4, one flat vector per forward call
    num_action_chunks: 1
    num_q_heads: 10

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
